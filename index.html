<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenseCheq Colour Configurator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    gap:30px;
}

#controls{
    width:320px;
    overflow-y:auto;
}

.part{
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
}

.part h3{
    margin-top:0;
    margin-bottom:10px;
    font-size:14px;
}

input[type="color"]{
    width:100%;
    height:40px;
}

input[type="range"]{
    width:100%;
}

button{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    font-size:14px;
    cursor:pointer;
}

#svg-container{
    flex:1;
}

#svg-container svg{
    width:100%;
    max-width:900px;
    height:auto;
}

</style>
</head>

<body>

<div id="controls">

    <h2>SenseCheq Configurator</h2>

    <button id="downloadPng">
        Download Image
    </button>

</div>

<div id="svg-container"></div>

<script>

window.addEventListener("DOMContentLoaded", function(){

    const parts = [
        "screen_surround",
        "stem",
        "stem_base",
        "enclosure_bottom",
        "button",
        "enclosure_top"
    ];

    fetch("sensecheq_picker.svg")

    .then(response => response.text())

    .then(svgText => {

        document.getElementById("svg-container").innerHTML =
            svgText;

        const controls =
            document.getElementById("controls");

        parts.forEach(part => {

            const shape =
                document.getElementById(part);

            if(!shape){

                console.error(
                    "Cannot find SVG part:",
                    part
                );

                return;
            }

            const panel =
                document.createElement("div");

            panel.className = "part";

            panel.innerHTML = `
                <h3>${part}</h3>

                <input
                    type="color"
                    id="${part}_colour"
                    value="#808080">

                <br><br>

                Opacity:
                <span id="${part}_opacity_text">
                    100%
                </span>

                <input
                    type="range"
                    id="${part}_opacity"
                    min="0"
                    max="100"
                    value="100">
            `;

            controls.appendChild(panel);

            const colourPicker =
                document.getElementById(
                    `${part}_colour`
                );

            const opacitySlider =
                document.getElementById(
                    `${part}_opacity`
                );

            const opacityText =
                document.getElementById(
                    `${part}_opacity_text`
                );

            colourPicker.addEventListener(
                "input",
                function(){

                    shape.style.fill =
                        this.value;

                }
            );

            opacitySlider.addEventListener(
                "input",
                function(){

                    shape.style.fillOpacity =
                        this.value / 100;

                    opacityText.textContent =
                        this.value + "%";

                }
            );

        });

        //
        // DOWNLOAD PNG BUTTON
        //
        document
            .getElementById("downloadPng")
            .addEventListener(
                "click",
                function(){

                    const svg =
                        document.querySelector(
                            "#svg-container svg"
                        );

                    htmlToImage
                        .toPng(svg, {
                            pixelRatio: 1,
                            backgroundColor: "white"
                        })

                        .then(function(dataUrl){

                            const link =
                                document.createElement("a");

                            link.download =
                                "sensecheq-design.png";

                            link.href =
                                dataUrl;

                            link.click();

                        })

                        .catch(function(error){

                            console.error(
                                "PNG export failed",
                                error
                            );

                            alert(
                                "PNG export failed. Check browser console."
                            );

                        });

                }
            );

    })

    .catch(error => {

        console.error(error);

        document.getElementById(
            "svg-container"
        ).innerHTML =
        "<h2>Failed to load SVG</h2>";

    });

});

</script>

</body>
</html>
