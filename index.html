<!DOCTYPE html>
<html>

<head>
    <title>SenseCheq Colour Configurator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
            display: flex;
            gap: 30px;
        }

        #controls {
            width: 350px;
        }

        .row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .row label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .row input[type="color"] {
            width: 100%;
            height: 40px;
        }

        .row input[type="range"] {
            width: 100%;
        }

        #svg-container {
            flex: 1;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .opacity-label {
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>

<body>

    <div id="controls">
        <h1>SenseCheq Configurator</h1>
    </div>

    <div id="svg-container"></div>

    <script>

        const parts = [
            "screen_surround",
            "stem",
            "stem_base",
            "enclosure_bottom",
            "faceplate",
            "button",
            "enclosure_top"
        ];

        fetch("sensecheq_picker.svg")
            .then(response => response.text())
            .then(svg => {

                document.getElementById("svg-container").innerHTML = svg;

                const controls =
                    document.getElementById("controls");

                parts.forEach(part => {

                    controls.innerHTML += `
                    <div class="row">

                        <label>${part}</label>

                        <input
                            type="color"
                            id="${part}_colour"
                            value="#808080">

                        <div class="opacity-label">
                            Opacity:
                            <span id="${part}_opacity_value">
                                100%
                            </span>
                        </div>

                        <input
                            type="range"
                            id="${part}_opacity"
                            min="0"
                            max="100"
                            value="100">

                    </div>
                    `;

                    const shape =
                        document.getElementById(part);

                    if (!shape) {
                        console.warn(
                            "Cannot find SVG element:",
                            part
                        );
                        return;
                    }

                    const colour =
                        document.getElementById(
                            part + "_colour"
                        );

                    const opacity =
                        document.getElementById(
                            part + "_opacity"
                        );

                    const opacityLabel =
                        document.getElementById(
                            part + "_opacity_value"
                        );

                    colour.addEventListener("input", () => {

                        shape.style.fill =
                            colour.value;

                    });

                    opacity.addEventListener("input", () => {

                        shape.style.fillOpacity =
                            opacity.value / 100;

                        opacityLabel.innerText =
                            opacity.value + "%";

                    });

                });

            });

    </script>

</body>

</html>
