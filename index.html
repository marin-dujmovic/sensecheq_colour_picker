<!DOCTYPE html>
<html>

<head>
    <title>SenseCheq Configurator</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:20px;
            display:flex;
            gap:30px;
        }

        #controls{
            width:300px;
        }

        #svg-container{
            flex:1;
        }

        svg{
            width:800px;
            max-width:100%;
        }

        .part{
            margin-bottom:15px;
            padding-bottom:10px;
            border-bottom:1px solid #ddd;
        }

    </style>
</head>

<body>

<div id="controls">
    <h1>SenseCheq Configurator</h1>
</div>

<div id="svg-container"></div>

<script>

const parts = [
    "screen_surround",
    "stem",
    "stem_base",
    "enclosure_bottom",
    "faceplate",
    "button",
    "enclosure_top"
];

fetch("sensecheq_picker.svg")
.then(response => response.text())
.then(svg => {

    document.getElementById("svg-container").innerHTML = svg;

    const controls =
        document.getElementById("controls");

    parts.forEach(part => {

        const div =
            document.createElement("div");

        div.className = "part";

        div.innerHTML = `
            <strong>${part}</strong><br>

            <input
                type="color"
                id="${part}_colour">

            <br><br>

            Opacity

            <input
                type="range"
                id="${part}_opacity"
                min="0"
                max="100"
                value="100">

            <span
                id="${part}_opacity_label">
                100%
            </span>
        `;

        controls.appendChild(div);

        const shape =
            document.getElementById(part);

        const colour =
            document.getElementById(
                `${part}_colour`
            );

        const opacity =
            document.getElementById(
                `${part}_opacity`
            );

        const label =
            document.getElementById(
                `${part}_opacity_label`
            );

        colour.addEventListener(
            "input",
            function(){

                shape.style.fill =
                    this.value;

            }
        );

        opacity.addEventListener(
            "input",
            function(){

                shape.style.fillOpacity =
                    this.value / 100;

                label.textContent =
                    this.value + "%";

            }
        );

    });

});

</script>

</body>
</html>
