<script>

const parts = [
    "screen_surround",
    "stem",
    "stem_base",
    "enclosure_bottom",
    "faceplate",
    "button",
    "enclosure_top"
];

fetch("sensecheq_picker.svg")
.then(response => response.text())
.then(svg => {

    document.getElementById("svg-container").innerHTML = svg;

    const controls =
        document.getElementById("controls");

    parts.forEach(part => {

        const div = document.createElement("div");

        div.innerHTML = `
            <h3>${part}</h3>

            <input
                type="color"
                id="${part}_colour"
                value="#808080">

            <br><br>

            Opacity:
            <input
                type="range"
                id="${part}_opacity"
                min="0"
                max="100"
                value="100">

            <span id="${part}_opacity_label">
                100%
            </span>

            <hr>
        `;

        controls.appendChild(div);

        const shape =
            document.getElementById(part);

        const colourPicker =
            document.getElementById(
                part + "_colour"
            );

        const opacitySlider =
            document.getElementById(
                part + "_opacity"
            );

        const opacityLabel =
            document.getElementById(
                part + "_opacity_label"
            );

        colourPicker.addEventListener(
            "input",
            function() {

                shape.style.fill =
                    this.value;

            }
        );

        opacitySlider.addEventListener(
            "input",
            function() {

                shape.style.fillOpacity =
                    this.value / 100;

                opacityLabel.textContent =
                    this.value + "%";

            }
        );

    });

});

</script>
